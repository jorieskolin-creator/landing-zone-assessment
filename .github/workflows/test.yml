name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: landing_zone_test
          POSTGRES_USER: landing_zone
          POSTGRES_PASSWORD: landing_zone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U landing_zone -d landing_zone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://landing_zone:landing_zone@localhost:5432/landing_zone_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node scripts/check-independence.mjs
      - run: npm run migrate
      - run: npm test
      - run: npm run build
      - run: npm run integration
